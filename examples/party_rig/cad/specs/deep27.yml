name: deep27
units: mm
# deep27 straight-cut tapped horn, 1 x 12-280-W. Generated by make_specs.py from deep27 fold_params
#   (horn_deep27.json, model outdoor_sub/fold3.py). External 1216 long x 550 wide x 700 high, 18 mm MDF.
# orientation: lying flat as in the stack. x = length, back wall at x = 0, mouth end at x = 1216;
#   y = width (0..550); z = up, bottom face on the ground at z = 0.
# SELF-CHECK (HANDOVER 3.7)
# 1. Air path, driver to mouth (internal width 514 mm throughout; areas in cm2, lengths in mm, as in fold3.py):
#    closed throat stub (middle layer, behind the driver)    490 ->    463 cm2 (514 x 95 -> 90 mm high),  170 mm
#    middle layer forward to the front gap               463 ->    338 cm2 (514 x 90 -> 66 mm high),  777 mm
#    front gap, up into the top layer                    129 ->    129 cm2 (514 x 25 -> 25 mm high),  122 mm
#    top layer backward                                  724 ->    188 cm2 (514 x 141 -> 37 mm high), 1066 mm
#    back channel, down to the bottom layer             1040 ->   1040 cm2 (514 x 202 -> 202 mm high),  401 mm
#    bottom layer forward past the driver's motor       2530 ->   2431 cm2 (514 x 492 -> 473 mm high),  289 mm
#    bottom layer forward to the mouth                  2431 ->   2160 cm2 (514 x 473 -> 420 mm high),  790 mm
#    Front of the cone feeds the middle layer (piston axis up, +z, tilted 3.8 deg with D1); the rear
#    and motor sit in the bottom layer (S3 at the driver), as in the 1D model.
# 2. Net air: design 384 L (horn_deep27.json air_litres); the 1D path sum gives 384 L.
#    Expect outer box 468.0 L - wood (spkmod cad prints it) - motor ~1.3 L to land within ~3 % of that.
# 3. Every internal panel spans the full inner width (y 18..532) and overlaps its neighbours by 2 mm.
#    Left out (not in the air path or < 1 %% of the section): 6 brace blocks 60 x 100 set on edge in line
#    with the flow, the gasketed driver hatch (flush), glue fillets, the 12 mm mouth round-over, handles, castors.
# 4. Mouth: the open slot at the front, x = 1216, y 18..532, z 18..438 (514 x 420 mm).
#    Piston 'drv': centre [408.4, 275.0, 499.9] mm (mid-thickness of D1, 790 mm from the front wall's inside face), front = up.
parts:
  - {type: box, name: side_l, at: [0.0, 0.0, 0.0], size: [1216.0, 18.0, 699.7]}
  - {type: box, name: side_r, at: [0.0, 532.0, 0.0], size: [1216.0, 18.0, 699.7]}
  - {type: box, name: bottom, at: [0.0, 18.0, 0.0], size: [1216.0, 514.0, 18.0]}
  - {type: box, name: top, at: [0.0, 18.0, 681.7], size: [1216.0, 514.0, 18.0]}
  - {type: box, name: back, at: [0.0, 18.0, 18.0], size: [18.0, 514.0, 663.7]}
  - {type: box, name: front, at: [1198.0, 18.0, 438.2], size: [18.0, 514.0, 243.5]}
  - {type: prism, name: d1_driver_divider, plane: xz, points: [[1200.0, 438.1], [220.4, 503.4], [220.4, 521.4], [1200.0, 456.1]], extrude: [18.0, 532.0]}
  - {type: prism, name: d0_upper_divider, plane: xz, points: [[1173.0, 524.1], [220.4, 617.3], [220.4, 635.3], [1173.0, 542.1]], extrude: [18.0, 532.0]}
  - {type: prism, name: stub, plane: xz, points: [[238.4, 518.2], [220.4, 519.4], [220.4, 619.3], [238.4, 617.5]], extrude: [18.0, 532.0]}
