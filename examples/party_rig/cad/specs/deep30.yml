name: deep30
units: mm
# deep30 straight-cut tapped horn, 1 x 12-280-W. Generated by make_specs.py from deep30 fold_params
#   (horn_deep30.json, model outdoor_sub/fold3.py). External 1216 long x 550 wide x 715 high, 18 mm MDF.
# orientation: lying flat as in the stack. x = length, back wall at x = 0, mouth end at x = 1216;
#   y = width (0..550); z = up, bottom face on the ground at z = 0.
# SELF-CHECK (HANDOVER 3.7)
# 1. Air path, driver to mouth (internal width 514 mm throughout; areas in cm2, lengths in mm, as in fold3.py):
#    closed throat stub (middle layer, behind the driver)    521 ->    460 cm2 (514 x 101 -> 89 mm high),  170 mm
#    middle layer forward to the front gap               460 ->    215 cm2 (514 x 89 -> 42 mm high),  678 mm
#    front gap, up into the top layer                    129 ->    129 cm2 (514 x 25 -> 25 mm high),  130 mm
#    top layer backward                                  933 ->    237 cm2 (514 x 182 -> 46 mm high), 1017 mm
#    back channel, down to the bottom layer             1552 ->   1552 cm2 (514 x 302 -> 302 mm high),  419 mm
#    bottom layer forward past the driver's motor       2485 ->   2375 cm2 (514 x 483 -> 462 mm high),  339 mm
#    bottom layer forward to the mouth                  2375 ->   2151 cm2 (514 x 462 -> 419 mm high),  690 mm
#    Front of the cone feeds the middle layer (piston axis up, +z, tilted 3.6 deg with D1); the rear
#    and motor sit in the bottom layer (S3 at the driver), as in the 1D model.
# 2. Net air: design 396 L (horn_deep30.json air_litres); the 1D path sum gives 396 L.
#    Expect outer box 478.0 L - wood (spkmod cad prints it) - motor ~1.3 L to land within ~3 % of that.
# 3. Every internal panel spans the full inner width (y 18..532) and overlaps its neighbours by 2 mm.
#    Left out (not in the air path or < 1 %% of the section): 6 brace blocks 60 x 100 set on edge in line
#    with the flow, the gasketed driver hatch (flush), glue fillets, the 12 mm mouth round-over, handles, castors.
# 4. Mouth: the open slot at the front, x = 1216, y 18..532, z 18..437 (514 x 419 mm).
#    Piston 'drv': centre [507.9, 275.0, 489.0] mm (mid-thickness of D1, 690 mm from the front wall's inside face), front = up.
parts:
  - {type: box, name: side_l, at: [0.0, 0.0, 0.0], size: [1216.0, 18.0, 714.7]}
  - {type: box, name: side_r, at: [0.0, 532.0, 0.0], size: [1216.0, 18.0, 714.7]}
  - {type: box, name: bottom, at: [0.0, 18.0, 0.0], size: [1216.0, 514.0, 18.0]}
  - {type: box, name: top, at: [0.0, 18.0, 696.7], size: [1216.0, 514.0, 18.0]}
  - {type: box, name: back, at: [0.0, 18.0, 18.0], size: [18.0, 514.0, 678.7]}
  - {type: box, name: front, at: [1198.0, 18.0, 436.6], size: [18.0, 514.0, 260.2]}
  - {type: prism, name: d1_driver_divider, plane: xz, points: [[1200.0, 436.4], [319.9, 491.9], [319.9, 509.9], [1200.0, 454.4]], extrude: [18.0, 532.0]}
  - {type: prism, name: d0_upper_divider, plane: xz, points: [[1173.0, 498.9], [319.9, 612.6], [319.9, 630.6], [1173.0, 516.9]], extrude: [18.0, 532.0]}
  - {type: prism, name: stub, plane: xz, points: [[337.9, 506.8], [319.9, 507.9], [319.9, 614.6], [337.9, 612.2]], extrude: [18.0, 532.0]}
cutouts:
  - {type: cylinder, name: drv_hole, center: [507.9, 275.0, 489.0], axis: [0.0629, 0.0, 0.998], diameter: 282, depth: 40}
pistons:
