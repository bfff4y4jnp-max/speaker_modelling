# orientation: lying flat as in the stack. x = length, back wall at x = 0, mouth end at x = 1216;
#   y = width (0..550); z = up, bottom face on the ground at z = 0.
# SELF-CHECK (HANDOVER 3.7)
# 1. Air path, driver to mouth (internal width 514 mm throughout; areas in cm2, lengths in mm, as in fold3.py):
#    closed throat stub (middle layer, behind the driver)    738 ->    544 cm2 (514 x 144 -> 106 mm high),  255 mm
#    middle layer forward to the front gap               544 ->    132 cm2 (514 x 106 -> 26 mm high),  543 mm
#    front gap, up into the top layer                    129 ->    129 cm2 (514 x 25 -> 25 mm high),  129 mm
#    top layer backward                                 1010 ->    262 cm2 (514 x 197 -> 51 mm high),  992 mm
#    back channel, down to the bottom layer             1804 ->   1804 cm2 (514 x 351 -> 351 mm high),  456 mm
#    bottom layer forward past the driver's motor       2153 ->   2155 cm2 (514 x 419 -> 419 mm high),  449 mm
#    bottom layer forward to the mouth                  2155 ->   2158 cm2 (514 x 419 -> 420 mm high),  556 mm
#    Front of the cone feeds the middle layer (piston axis up, +z, tilted -0.1 deg with D1); the rear
#    and motor sit in the bottom layer (S3 at the driver), as in the 1D model.
# 2. Net air: design 398 L (horn_v3d_g_back120.json air_litres); the 1D path sum gives 398 L.
#    Expect outer box 477.5 L - wood (spkmod cad prints it) - motor ~1.3 L to land within ~3 % of that.
# 3. Every internal panel spans the full inner width (y 18..532) and overlaps its neighbours by 2 mm.
#    Left out (not in the air path or < 1 %% of the section): 6 brace blocks 60 x 100 set on edge in line
#    with the flow, the gasketed driver hatch (flush), glue fillets, the 12 mm mouth round-over, handles, castors.
# 4. Mouth: the open slot at the front, x = 1216, y 18..532, z 18..438 (514 x 420 mm).
#    Piston 'drv': centre [642.2, 275.0, 446.3] mm (mid-thickness of D1, 556 mm from the front wall's inside face), front = up.
