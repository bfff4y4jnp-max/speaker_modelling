# CamillaDSP v3, outdoor party system CANDIDATE REV 2, preset DAY (sub lift +0 dB, peak at 65 Hz Q0.9).
# Generated by camilla_gen_rev2.py from the integration floor model; model values, tune on site. Not yet approved by Peter.
# In: stereo from the mixer (USB), summed to mono M for every channel (fills deferred: S unused).
# Out: 0 sub front pair (4 ohm) | 1 sub rear pair (4 ohm, inverted) | 2 low-mid horn (4 ohm) | 3 pole lower 8" (4 ohm)
#      4 pole upper 8" (4 ohm) | 5 DE250 (8 ohm) | 6, 7 spare (silent): hot spare for any channel, or the deferred fills
# Latency: ~70 ms FIR + ~21 ms buffers. DJ monitors from the mixer's booth output, not the PA.
devices:
  samplerate: 48000
  chunksize: 1024
  volume_limit: 0.0         # master volume ceiling (dB); set on site so the program compressor holds ~100 dBA at the floor centre
  capture: {type: Alsa, channels: 2, device: "hw:Mixer", format: S32LE}
  playback: {type: Alsa, channels: 8, device: "hw:DAC8x", format: S32LE}
mixers:
  mono8:
    channels: {in: 2, out: 8}
    mapping:
      - dest: 0
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
      - dest: 1
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
      - dest: 2
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
      - dest: 3
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
      - dest: 4
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
      - dest: 5
        sources: [{channel: 0, gain: -6.02}, {channel: 1, gain: -6.02}]
filters:
  fir_mono:
    type: Conv
    parameters: {type: Wav, filename: fir_mono_48k_deep70.wav}   # excess-phase all-pass FIR
  floor_eq1:
    type: Biquad
    parameters: {type: Peaking, freq: 167.6, q: 1.54, gain: -4.73}
  floor_eq2:
    type: Biquad
    parameters: {type: Peaking, freq: 2455.7, q: 2.0, gain: -0.63}
  floor_eq3:
    type: Biquad
    parameters: {type: Peaking, freq: 5545.3, q: 2.0, gain: -0.26}
  floor_eq4:
    type: Biquad
    parameters: {type: Peaking, freq: 1052.6, q: 1.83, gain: 5.44}
  floor_eq5:
    type: Biquad
    parameters: {type: Peaking, freq: 3361.1, q: 2.0, gain: -0.53}
  sub_shelf:
    type: Biquad
    parameters: {type: Peaking, freq: 65, q: 0.9, gain: 0.0}   # kick lift; a broad peak leaves 25-40 Hz less boosted than a shelf (review thread)
  sub_hp:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 34.0, order: 4}
  lr_lpx1:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 80, order: 4}
  lr_hpx1:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 80, order: 4}
  lr_lp350:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 350, order: 4}
  lr_hp350:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 350, order: 4}
  lr_lp800:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 800, order: 4}
  lr_lp1200:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 1200, order: 4}
  lr_hp1200:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 1200, order: 4}
  wg_eq:
    type: Biquad
    parameters: {type: Highshelf, freq: 10000, slope: 6, gain: 3.5}   # waveguide/CD shelf placeholder until measured
  d_rear:
    type: Delay
    parameters: {delay: 3.5, unit: ms, subsample: true}
  d_lowmid:
    type: Delay
    parameters: {delay: 10.75, unit: ms, subsample: true}
  d_pole:
    type: Delay
    parameters: {delay: 11.0, unit: ms, subsample: true}
  d_horn:
    type: Delay
    parameters: {delay: 11.25, unit: ms, subsample: true}
  g_sub:
    type: Gain
    parameters: {gain: -16.74, inverted: false}
  g_sub_rear:
    type: Gain
    parameters: {gain: -16.74, inverted: true}
  g_lowmid:
    type: Gain
    parameters: {gain: -12.44, inverted: false}
  g_pole:
    type: Gain
    parameters: {gain: -12.97, inverted: false}
  g_horn:
    type: Gain
    parameters: {gain: -17.22, inverted: false}
processors:
  # fast per-band compressors at each amp's clip (thresholds set on site with a test tone), replacing rev 1's clip limiters
  comp_sub:
    type: Compressor
    parameters: {channels: 8, monitor_channels: [0, 1], process_channels: [0, 1], attack: 0.005, release: 0.25, threshold: -6.0, factor: 8.0, makeup_gain: 0.0, clip_limit: -0.5, soft_clip: false}
  comp_lowmid:
    type: Compressor
    parameters: {channels: 8, monitor_channels: [2], process_channels: [2], attack: 0.003, release: 0.15, threshold: -6.0, factor: 8.0, makeup_gain: 0.0, clip_limit: -0.5, soft_clip: false}
  comp_pole:
    type: Compressor
    parameters: {channels: 8, monitor_channels: [3, 4], process_channels: [3, 4], attack: 0.002, release: 0.1, threshold: -6.0, factor: 8.0, makeup_gain: 0.0, clip_limit: -0.5, soft_clip: false}
  comp_horn:
    type: Compressor
    parameters: {channels: 8, monitor_channels: [5], process_channels: [5], attack: 0.001, release: 0.08, threshold: -6.0, factor: 8.0, makeup_gain: 0.0, clip_limit: -0.5, soft_clip: false}
pipeline:
  - type: Mixer
    name: mono8
  - type: Filter
    channels: [0]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, sub_shelf, sub_hp, lr_lpx1, g_sub]
  - type: Filter
    channels: [1]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, sub_shelf, sub_hp, lr_lpx1, d_rear, g_sub_rear]
  - type: Filter
    channels: [2]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, lr_hpx1, lr_lp350, d_lowmid, g_lowmid]
  - type: Filter
    channels: [3]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, lr_hp350, lr_lp800, d_pole, g_pole]
  - type: Filter
    channels: [4]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, lr_hp350, lr_lp1200, d_pole, g_pole]
  - type: Filter
    channels: [5]
    names: [fir_mono, floor_eq1, floor_eq2, floor_eq3, floor_eq4, floor_eq5, lr_hp1200, wg_eq, d_horn, g_horn]
  - type: Processor
    name: comp_sub
  - type: Processor
    name: comp_lowmid
  - type: Processor
    name: comp_pole
  - type: Processor
    name: comp_horn
