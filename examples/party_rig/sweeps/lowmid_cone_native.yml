# Low-mid cone dish with spkmod's native piston recess (PR #19): cross-check of lowmid_cone.yml, whose recess was
# hand-built in CAD. Same scene, band and reference. Frame cutout 290 mm (282 = hole bore leaves a sliver opening
# at the native basket ring).
project: ../project.yml
scenes: [stack]
frequencies: {min: 70, max: 450, per_octave: 24}
dsp: flat
bands: sixth
reference: flat
variants:
  - name: flat
    remove: [sub_rear_l, sub_rear_r, sub_front_l, sub_front_r]
    project: {solver: {refine_gaps: true}}
  - name: native30
    remove: [sub_rear_l, sub_rear_r, sub_front_l, sub_front_r]
    replace: {lowmid: {cabinet: lowmid_n30}}
    project:
      solver: {refine_gaps: true}
      cabinets: {lowmid_n30: {step: cad/lowmid.step, pistons: [{name: drv_a, center: [0.2604, 0.178, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.29, thickness: 0.008, motor: [0.156, 0.07], recess: 0.03}, {name: drv_b, center: [0.2604, 0.498, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.29, thickness: 0.008, motor: [0.156, 0.07], recess: 0.03}]}}
  - name: native45
    remove: [sub_rear_l, sub_rear_r, sub_front_l, sub_front_r]
    replace: {lowmid: {cabinet: lowmid_n45}}
    project:
      solver: {refine_gaps: true}
      cabinets: {lowmid_n45: {step: cad/lowmid.step, pistons: [{name: drv_a, center: [0.2604, 0.178, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.29, thickness: 0.008, motor: [0.156, 0.07], recess: 0.045}, {name: drv_b, center: [0.2604, 0.498, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.29, thickness: 0.008, motor: [0.156, 0.07], recess: 0.045}]}}
