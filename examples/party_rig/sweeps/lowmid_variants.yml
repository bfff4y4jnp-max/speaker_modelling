# Low-mid geometry variants from the low-mid thread (outdoor_lowmid/lm3d_variants.py; specs, README and
# variants.json copied to cad/lm3d/). Static STEPs built with spkmod cad (generated STEPs lose their fields at merge).
# Low-mid alone on the ground (subs removed): throat impedance (fields Z), ground SPL/V at 1 and 2 m, floor.
project: ../project.yml
scenes: [stack]
frequencies: {min: 70, max: 500, per_octave: 24}
dsp: flat
bands: sixth
reference: v01_cav37
zones:
  ground_1m: {box: [1.95, 1.95, 0.0, 0.0], heights: [0.005], spacing: 1.0}
  ground_2m: {box: [2.95, 2.95, 0.0, 0.0], heights: [0.005], spacing: 1.0}
variants:
  - name: v01_cav37
    remove: [sub_rear_l, sub_rear_r, sub_front_l, sub_front_r]
    replace: {lowmid: {cabinet: lowmid_v01_cav37}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        lowmid_v01_cav37: {step: cad/lm3d/lowmid_v01_cav37.step, pistons: [{name: drv_a, center: [0.2537, 0.178, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}, {name: drv_b, center: [0.2537, 0.498, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
