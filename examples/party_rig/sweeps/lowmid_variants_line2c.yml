    replace: {lowmid: {cabinet: lowmid_v09_divfull}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        lowmid_v09_divfull: {step: cad/lm3d/lowmid_v09_divfull.step, pistons: [{name: drv_a, center: [0.2537, 0.178, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}, {name: drv_b, center: [0.2537, 0.498, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
