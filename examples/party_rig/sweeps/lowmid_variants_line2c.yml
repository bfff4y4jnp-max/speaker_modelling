# Low-mid geometry variants from the low-mid thread (outdoor_lowmid/lm3d_variants.py; specs, README and
# variants.json copied to cad/lm3d/). Static STEPs built with spkmod cad (generated STEPs lose their fields at merge).
# In the build layout line2c (sub, LM, sub, mouths flush at x 0; rear subs removed): floor stats per channel.
project: ../project.yml
scenes: [stack]
frequencies: {min: 25, max: 500, per_octave: 24}
dsp: flat
bands: sixth
reference: v01_cav37
zones:
  ground_1m: {box: [1.0, 1.0, 0.0, 0.0], heights: [0.005], spacing: 1.0}
  ground_2m: {box: [2.0, 2.0, 0.0, 0.0], heights: [0.005], spacing: 1.0}
variants:
  - name: v01_cav37
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {lowmid: {cabinet: lowmid_v01_cav37}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        lowmid_v01_cav37: {step: cad/lm3d/lowmid_v01_cav37.step, pistons: [{name: drv_a, center: [0.2537, 0.178, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}, {name: drv_b, center: [0.2537, 0.498, 0.3091], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v00_flat
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {lowmid: {cabinet: lowmid_v00_flat}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        lowmid_v00_flat: {step: cad/lm3d/lowmid_v00_flat.step, pistons: [{name: drv_a, center: [0.2604, 0.178, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}, {name: drv_b, center: [0.2604, 0.498, 0.2819], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v02_cav61
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {lowmid: {cabinet: lowmid_v02_cav61}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        lowmid_v02_cav61: {step: cad/lm3d/lowmid_v02_cav61.step, pistons: [{name: drv_a, center: [0.2478, 0.178, 0.3323], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}, {name: drv_b, center: [0.2478, 0.498, 0.3323], axis: [0.2425, 0.0, -0.9701], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v09_divfull
    remove: [sub_rear_l, sub_rear_r]
