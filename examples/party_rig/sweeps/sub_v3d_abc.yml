# deep30 shortlist from the sub thread (outdoor_sub/spk_variants, specs copied to cad/v3d/), static STEPs built with
# spkmod cad. Build layout line2c: two forward horns, mouths flush at the stack face x = 0, low-mid on the ground
# between them; rear row removed. Both subs swapped to the variant. First batch: a (as built), b and c (path length x0.96, x0.92).
project: ../project.yml
scenes: [stack]
frequencies: {min: 25, max: 250, per_octave: 24}
dsp: flat
bands: sixth
reference: v3d_a_deep30
variants:
  - name: v3d_a_deep30
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_a_deep30}, sub_front_r: {cabinet: v3d_a_deep30}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_a_deep30: {step: cad/v3d/v3d_a_deep30.step, pistons: [{name: drv, center: [0.5079, 0.275, 0.489], axis: [0.0629, 0.0, 0.998], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v3d_b_k096
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_b_k096}, sub_front_r: {cabinet: v3d_b_k096}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_b_k096: {step: cad/v3d/v3d_b_k096.step, pistons: [{name: drv, center: [0.5291, 0.275, 0.4803], axis: [0.0672, 0.0, 0.9977], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v3d_c_k092
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_c_k092}, sub_front_r: {cabinet: v3d_c_k092}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_c_k092: {step: cad/v3d/v3d_c_k092.step, pistons: [{name: drv, center: [0.5837, 0.275, 0.4462], axis: [-0.0009, 0.0, 1.0], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
