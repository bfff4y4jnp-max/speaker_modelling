# deep30 shortlist from the sub thread (outdoor_sub/spk_variants, specs copied to cad/v3d/), static STEPs built with
# spkmod cad. Build layout line2c: two forward horns, mouths flush at the stack face x = 0, low-mid on the ground
# between them; rear row removed. Both subs swapped to the variant. Second batch: d tap 170, e mouth 85%, f gap 40, g back 120.
project: ../project.yml
scenes: [stack]
frequencies: {min: 25, max: 250, per_octave: 24}
dsp: flat
bands: sixth
reference: v3d_a_deep30
variants:
  - name: v3d_d_tap170
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_d_tap170}, sub_front_r: {cabinet: v3d_d_tap170}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_d_tap170: {step: cad/v3d/v3d_d_tap170.step, pistons: [{name: drv, center: [0.4984, 0.275, 0.4461], axis: [-0.0009, 0.0, 1.0], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v3d_e_mouth85
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_e_mouth85}, sub_front_r: {cabinet: v3d_e_mouth85}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_e_mouth85: {step: cad/v3d/v3d_e_mouth85.step, pistons: [{name: drv, center: [0.5837, 0.275, 0.3832], axis: [-0.0009, 0.0, 1.0], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v3d_f_gap40
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_f_gap40}, sub_front_r: {cabinet: v3d_f_gap40}}
    project:
      solver: {refine_gaps: true}
      cabinets:
        v3d_f_gap40: {step: cad/v3d/v3d_f_gap40.step, pistons: [{name: drv, center: [0.5837, 0.275, 0.4462], axis: [-0.0009, 0.0, 1.0], sd_cm2: 510.7, cutout: 0.282, thickness: 0.008, motor: [0.156, 0.07]}]}
  - name: v3d_g_back120
    remove: [sub_rear_l, sub_rear_r]
    move: {sub_front_l: {position: [-1.216, 0.338, 0.0], rotation: [0, 0, 0]}, sub_front_r: {position: [-1.216, -0.888, 0.0], rotation: [0, 0, 0]}, lowmid: {position: [-0.496, -0.338, 0.0], rotation: [0, 0, 0]}}
    replace: {sub_front_l: {cabinet: v3d_g_back120}, sub_front_r: {cabinet: v3d_g_back120}}
